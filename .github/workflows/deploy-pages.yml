name: Deploy website to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Use latest stable npm
        run: npm install -g npm@12

      - name: Normalize lockfile registry URLs
        run: sed -i 's|https://registry.npmmirror.com/|https://registry.npmjs.org/|g' package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API }}
          accountId: 9ac9f96b683fc7350c779e5e8e082513
          command: >-
            pages deploy dist
            --project-name rongxzyai-pages
            --branch main
            --commit-hash ${{ github.sha }}
            --commit-dirty=false
